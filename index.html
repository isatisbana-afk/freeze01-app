<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeze01 - سامانه محاسبه حقوق مهندسین</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Freeze01 Cloud Mobile</h1>
            <p>سامانه محاسبه حقوق و دستمزد مهندسین کارگاهی (K-CORE)</p>
        </header>

        <main class="main-content">
            <section class="card">
                <h2>ورودی‌های کارکرد ماهانه</h2>
                <div class="form-group">
                    <label>مزد روزانه شغل (ریال):</label>
                    <input type="number" id="dailyWage" value="3200000">
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>ساعات موظف:</label>
                        <input type="number" id="requiredHours" value="176">
                    </div>
                    <div class="form-group">
                        <label>ساعات کارکرد:</label>
                        <input type="number" id="workedHours" value="180">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>اضافه‌کاری (ساعت):</label>
                        <input type="number" id="otHours" value="20">
                    </div>
                    <div class="form-group">
                        <label>تعطیل‌کاری (ساعت):</label>
                        <input type="number" id="holidayHours" value="8">
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>ضرایب ۷گانه K-CORE</h2>
                <div class="factors-grid">
                    <div><label>n2:</label><input type="number" step="0.01" id="n2" value="1.05"></div>
                    <div><label>n3:</label><input type="number" step="0.01" id="n3" value="1.15"></div>
                    <div><label>n4:</label><input type="number" step="0.01" id="n4" value="1.08"></div>
                    <div><label>n5:</label><input type="number" step="0.01" id="n5" value="1.05"></div>
                    <div><label>n6:</label><input type="number" step="0.01" id="n6" value="1.02"></div>
                    <div><label>n7:</label><input type="number" step="0.01" id="n7" value="1.02"></div>
                    <div><label>n8:</label><input type="number" step="0.01" id="n8" value="1.365"></div>
                </div>
                <button id="calcBtn" class="btn-primary">محاسبه حقوق و بررسی هشدارها</button>
            </section>

            <section class="card result-card">
                <h2>خروجی محاسبات Freeze01</h2>
                <div id="alertBadge" class="badge badge-ok">وضعیت: OK</div>
                <p id="alertText" class="alert-desc">محاسبات طبیعی است.</p>

                <div class="results-table">
                    <div class="res-row"><span>حقوق مبنا (Bi):</span><strong id="resBi">0</strong></div>
                    <div class="res-row"><span>ضریب کل K:</span><strong id="resK">0</strong></div>
                    <div class="res-row"><span>حق‌الزحمه (Si):</span><strong id="resSi">0</strong></div>
                    <div class="res-row"><span>جمع ناخالص:</span><strong id="resGross">0</strong></div>
                    <div class="res-row"><span>مالیات ۱۰٪:</span><strong id="resTax">0</strong></div>
                    <div class="res-row highlight"><span>خالص دریافتی:</span><strong id="resNet">0</strong></div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
