<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاسبه‌گر حقوق Freeze-01</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #2b579a; padding-bottom: 10px; color: #2b579a; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { font-size: 0.9em; font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 90%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #2b579a; color: white; border: none; padding: 12px 20px; font-size: 1em; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background-color: #1e3d6f; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 1.1em; display: none; }
        .RED { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .ORANGE { background-color: #ffe8d6; color: #856404; border: 1px solid #ffe8d6; }
        .YELLOW { background-color: #fff3cd; color: #856404; border: 1px solid #ffeba2; }
        .BLUE { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .GREEN { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>سیستم محاسبه حقوق Freeze-01 (یزد)</h2>
    
    <div class="grid">
        <div>
            <label>مزد شغل روزانه (ریال):</label>
            <input type="number" id="dailyWage" value="3000000">
        </div>
        <div>
            <label>ضریب n2 (محیط کارگاهی):</label>
            <input type="number" step="0.01" id="n2" value="1.0">
        </div>
        <div>
            <label>ضریب n3 (مسئولیت):</label>
            <input type="number" step="0.01" id="n3" value="1.0">
        </div>
        <div>
            <label>ضریب n4 (سختی کار):</label>
            <input type="number" step="0.01" id="n4" value="1.0">
        </div>
        <div>
            <label>ضریب n5 (پروژه‌محور):</label>
            <input type="number" step="0.01" id="n5" value="1.0">
        </div>
        <div>
            <label>ضریب n6 (تخصصی):</label>
            <input type="number" step="0.01" id="n6" value="1.0">
        </div>
        <div>
            <label>ضریب n7 (کارایی):</label>
            <input type="number" step="0.01" id="n7" value="1.0">
        </div>
        <div>
            <label>ضریب n8 (منطقه‌ای - یزد):</label>
            <input type="number" step="0.001" id="n8" value="1.365">
        </div>
        <div>
            <label>ساعات کارکرد واقعی:</label>
            <input type="number" id="workedHours" value="176">
        </div>
        <div>
            <label>ساعات موظفی ماهانه:</label>
            <input type="number" id="requiredHours" value="176">
        </div>
        <div>
            <label>ساعات اضافه‌کاری:</label>
            <input type="number" id="overtimeHours" value="10">
        </div>
        <div>
            <label>ساعات تعطیل‌کاری:</label>
            <input type="number" id="holidayHours" value="0">
        </div>
    </div>

    <button onclick="calculate()">محاسبه حقوق و وضعیت هشدار</button>

    <div id="result" class="result-box"></div>
</div>

<script>
function calculate() {
    const dailyBaseWage = parseFloat(document.getElementById('dailyWage').value) || 0;
    const n2 = parseFloat(document.getElementById('n2').value);
    const n3 = parseFloat(document.getElementById('n3').value);
    const n4 = parseFloat(document.getElementById('n4').value);
    const n5 = parseFloat(document.getElementById('n5').value);
    const n6 = parseFloat(document.getElementById('n6').value);
    const n7 = parseFloat(document.getElementById('n7').value);
    const n8 = parseFloat(document.getElementById('n8').value) || 1.365;
    
    const workedHours = parseFloat(document.getElementById('workedHours').value) || 0;
    const requiredHours = parseFloat(document.getElementById('requiredHours').value) || 0;
    const overtimeHours = parseFloat(document.getElementById('overtimeHours').value) || 0;
    const holidayHours = parseFloat(document.getElementById('holidayHours').value) || 0;

    // Bi = DailyBaseWage * 30.5
    const Bi = dailyBaseWage * 30.5;

    const resBox = document.getElementById('result');
    resBox.style.display = 'block';

    // بررسی ضریب خالی (YELLOW)
    if ([n2, n3, n4, n5, n6, n7].some(n => isNaN(n) || n === 0)) {
        resBox.className = 'result-box YELLOW';
        resBox.innerHTML = `<strong>وضعیت: YELLOW</strong><br>هشدار: یکی از ضرایب هفت‌گانه ثبت نشده یا خالی است.`;
        return;
    }

    // K = n2 * n3 * n4 * n5 * n6 * n7 * n8
    const K = n2 * n3 * n4 * n5 * n6 * n7 * n8;
    const Si = Bi * K;

    const otPay = overtimeHours * (Bi / 176) * 1.4;
    const holidayPay = holidayHours * (Bi / 176) * 1.5;
    const totalPay = Si + otPay + holidayPay;

    let alertType = 'GREEN';
    let alertMsg = 'وضعیت محاسبه نرمال و مورد تأیید است.';

    if (Si < Bi) {
        alertType = 'RED';
        alertMsg = 'خطای حقوق: حقوق محاسباتی Si کمتر از حقوق پایه Bi است.';
    } else if (workedHours < requiredHours) {
        alertType = 'ORANGE';
        alertMsg = 'هشدار: کارکرد ثبت‌شده کمتر از ساعات موظفی ماهانه است.';
    } else if (overtimeHours > 60) {
        alertType = 'BLUE';
        alertMsg = 'تذکر: ساعات اضافه‌کاری بیش از سقف استاندارد (۶۰ ساعت) است.';
    }

    resBox.className = `result-box ${alertType}`;
    resBox.innerHTML = `
        <strong>وضعیت سیستم: ${alertType}</strong> - ${alertMsg}<br><hr>
        <b>حقوق پایه ماهانه (Bi):</b> ${Bi.toLocaleString()} ریال<br>
        <b>ضریب جامع Freeze-01 (K):</b> ${K.toFixed(4)}<br>
        <b>حق‌الزحمه Freeze-01 (Si):</b> ${Si.toLocaleString()} ریال<br>
        <b>اضافه‌کاری / تعطیل‌کاری:</b> ${(otPay + holidayPay).toLocaleString()} ریال<br>
        <b>جمع کل پرداختی (TotalPay):</b> ${totalPay.toLocaleString()} ریال
    `;
}
</script>

</body>
</html>
