<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاسبه حقوق مدیریت کارگاه</title>
</head>
<body>
    <h2>سامانه محاسبه حقوق و مابه‌التفاوت کارگاه</h2>

    <!-- کادرهای ورودی اطلاعات -->
    <div>
        <label>حق‌الزحمه پایه ماهانه (Si):</label><br>
        <input type="number" id="Si" value="100000000"><br><br>

        <label>ساعات موظف ماهانه (Tm):</label><br>
        <input type="number" id="Tm" value="180"><br><br>

        <label>ساعات کار روزانه (Tr):</label><br>
        <input type="number" id="Tr" value="170"><br><br>

        <label>ساعات کار شبانه (Ts):</label><br>
        <input type="number" id="Ts" value="20"><br><br>

        <!-- دکمه محاسبه -->
        <button onclick="runCalculation()">محاسبه حقوق</button>
    </div>

    <hr>

    <!-- محل نمایش نتایج -->
    <div id="output"></div>

    <!-- اتصال فایل‌های جاوااسکریپت -->
    <script src="payroll_engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
