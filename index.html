<fieldset class="env-group">
    <legend>ضرایب ۷‌گانه شرایط محیطی و کارگاهی ($n_2$ تا $n_8$)</legend>
    <div class="env-grid">
        <div><label>n2 (دوری از مرکز):</label><input type="number" step="0.01" class="env-factor" value="1.00" oninput="calculatePayroll()"></div>
        <div><label>n3 (خطرات کارگاه):</label><input type="number" step="0.01" class="env-factor" value="1.00" oninput="calculatePayroll()"></div>
        <div><label>n4 (تسهیلات رفاهی):</label><input type="number" step="0.01" class="env-factor" value="1.00" oninput="calculatePayroll()"></div>
        <div><label>n5 (شیفت کاری):</label><input type="number" step="0.01" class="env-factor" value="1.00" oninput="calculatePayroll()"></div>
        <div><label>n6 (حساسیت پروژه):</label><input type="number" step="0.01" class="env-factor" value="1.00" oninput="calculatePayroll()"></div>
        <div><label>n7 (فشار زمان‌بندی):</label><input type="number" step="0.01" class="env-factor" value="1.00" oninput="calculatePayroll()"></div>
        <div><label>n8 (تجربه تخصصی):</label><input type="number" step="0.01" class="env-factor" value="1.00" oninput="calculatePayroll()"></div>
    </div>
</fieldset>
